name: Prepare Next.js 16 dependency upgrade

on:
  push:
    branches: [next16-upgrade]

permissions:
  contents: write

concurrency:
  group: next16-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      - name: Upgrade framework and React
        run: npm install next@16.4.5 react@latest react-dom@latest
      - name: Upgrade TypeScript definitions
        run: npm install --save-dev @types/react@latest @types/react-dom@latest @types/node@^24
      - name: Replace removed Next.js lint command with type checking
        run: |
          npm pkg delete scripts.lint
          npm pkg set 'scripts.typecheck=tsc --noEmit'
      - name: Verify tests, types, and production build
        run: npm audit --omit=dev && npm test && npm run typecheck && npm run build
      - name: Commit generated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade Next.js and React dependencies [skip ci]"
          git push
