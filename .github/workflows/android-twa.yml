name: Android TWA validation and build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "scripts/validate-android-pwa.mjs"
      - ".github/workflows/android-twa.yml"

permissions:
  contents: read

concurrency:
  group: android-twa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate PWA and build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 36 build components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli@1.27.0

      - name: Configure Bubblewrap toolchain without interactive prompts
        working-directory: android
        run: |
          CMDLINE_TOOLS_BIN="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -n "$CMDLINE_TOOLS_BIN"
          if [ ! -e "$ANDROID_HOME/bin" ]; then
            ln -s "$CMDLINE_TOOLS_BIN" "$ANDROID_HOME/bin"
          fi
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Validate production PWA resources and install contract
        run: node scripts/validate-android-pwa.mjs

      - name: Generate Android project from the reviewed TWA manifest
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Enforce and verify Android release version metadata
        working-directory: android
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          config = json.loads(Path("twa-manifest.json").read_text())
          expected_name = str(config.get("appVersionName", "")).strip()
          expected_code = int(config.get("appVersionCode", 0))
          if not expected_name or expected_code < 1:
              raise SystemExit("twa-manifest.json must define appVersionName and a positive appVersionCode")

          gradle = Path("app/build.gradle")
          source = gradle.read_text()
          code_pattern = re.compile(r"(?m)^(\\s*)versionCode\\s+\\d+\\s*$")
          match = code_pattern.search(source)
          if not match:
              raise SystemExit("Bubblewrap generated app/build.gradle without a versionCode declaration")

          indent = match.group(1)
          source = code_pattern.sub(
              lambda m: f'{indent}versionCode {expected_code}\\n{indent}versionName "{expected_name}"',
              source,
              count=1,
          )
          lines = source.splitlines()
          seen = False
          normalized = []
          for line in lines:
              if re.match(r"^\\s*versionName\\s+", line):
                  if seen:
                      continue
                  seen = True
              normalized.append(line)
          source = "\\n".join(normalized) + "\\n"
          gradle.write_text(source)

          if not re.search(rf'(?m)^\\s*versionName\\s+"{re.escape(expected_name)}"\\s*        working-directory: android
        run: |
          grep -Fq 'applicationId "ir.eltbabak.contentfactory"' app/build.gradle
          grep -Eq 'minSdkVersion 24' app/build.gradle
          grep -Eq 'targetSdkVersion 36' app/build.gradle

      - name: Build unsigned Android App Bundle for internal testing
        working-directory: android
        run: bubblewrap build --skipSigning --skipPwaValidation --manifest=./twa-manifest.json

      - name: Build installable debug APK for device acceptance testing
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-content-factory-android-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app-release-bundle.aab
            android/app-release-signed.apk
, source):
              raise SystemExit("Could not enforce expected Android versionName")
          if not re.search(rf"(?m)^\\s*versionCode\\s+{expected_code}\\s*$", source):
              raise SystemExit("Could not enforce expected Android versionCode")
          print(f"Android release metadata verified: versionName={expected_name}, versionCode={expected_code}")
          PY

      - name: Verify generated Android package and Play target API
        working-directory: android
        run: |
          grep -Fq 'applicationId "ir.eltbabak.contentfactory"' app/build.gradle
          grep -Eq 'minSdkVersion 24' app/build.gradle
          grep -Eq 'targetSdkVersion 36' app/build.gradle

      - name: Build unsigned Android App Bundle for internal testing
        working-directory: android
        run: bubblewrap build --skipSigning --skipPwaValidation --manifest=./twa-manifest.json

      - name: Build installable debug APK for device acceptance testing
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-content-factory-android-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app-release-bundle.aab
            android/app-release-signed.apk
