name: Android TWA validation and build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "public/icons/**"
      - "app/manifest.ts"
      - "app/layout.tsx"
      - "scripts/generate-pwa-icons.mjs"
      - "scripts/validate-android-pwa.mjs"
      - ".github/workflows/android-twa.yml"
  pull_request:
    paths:
      - "android/**"
      - "public/icons/**"
      - "app/manifest.ts"
      - "app/layout.tsx"
      - "scripts/generate-pwa-icons.mjs"
      - "scripts/validate-android-pwa.mjs"
      - ".github/workflows/android-twa.yml"

permissions:
  contents: read

concurrency:
  group: android-twa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate PWA and build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 36 build components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli@1.27.0

      - name: Configure Bubblewrap toolchain without interactive prompts
        working-directory: android
        run: |
          CMDLINE_TOOLS_BIN="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -n "$CMDLINE_TOOLS_BIN"
          if [ ! -e "$ANDROID_HOME/bin" ]; then
            ln -s "$CMDLINE_TOOLS_BIN" "$ANDROID_HOME/bin"
          fi
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Validate production PWA resources and install contract
        run: node scripts/validate-android-pwa.mjs

      - name: Generate Android project from the reviewed TWA manifest
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Enforce and verify Android release version metadata
        run: node scripts/ensure-android-version.mjs

      - name: Verify generated Android package and Play target API
        working-directory: android
        run: |
          grep -Fq 'applicationId "ir.eltbabak.contentfactory"' app/build.gradle
          grep -Eq 'minSdkVersion 24' app/build.gradle
          grep -Eq 'targetSdkVersion 36' app/build.gradle

      - name: Build unsigned Android App Bundle for internal testing
        working-directory: android
        run: bubblewrap build --skipSigning --skipPwaValidation --manifest=./twa-manifest.json

      - name: Build installable debug APK for device acceptance testing
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify installable debug APK metadata and signature
        working-directory: android
        run: |
          PACKAGE_ID="$(node -p "require('./twa-manifest.json').packageId")"
          VERSION_CODE="$(node -p "require('./twa-manifest.json').appVersionCode")"
          VERSION_NAME="$(node -p "require('./twa-manifest.json').appVersionName")"
          APK="./app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK")"
          printf '%s\\n' "$BADGING" | grep -F "package: name='${PACKAGE_ID}' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-content-factory-android-release-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app-release-unsigned-aligned.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app-release-bundle.aab
            android/app-release-signed.apk
