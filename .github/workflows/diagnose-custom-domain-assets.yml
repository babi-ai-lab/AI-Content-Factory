name: Diagnose custom-domain asset delivery

on:
  push:
    branches:
      - "diagnostic/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare root HTML and Next.js assets across Render edge IPs
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/probe
          for target in "216.24.57.16" "216.24.57.18" "default"; do
            echo "===== TARGET $target ====="
            if [ "$target" = "default" ]; then
              resolve_args=()
            else
              resolve_args=(--resolve "app.eltbabak.ir:443:$target")
            fi
            root="/tmp/probe/root-$target.html"
            headers="/tmp/probe/headers-$target.txt"
            code=$(curl -sS -L "${resolve_args[@]}" --connect-timeout 12 --max-time 35 -D "$headers" -o "$root" -w '%{http_code}' https://app.eltbabak.ir/ || true)
            echo "ROOT_HTTP=$code ROOT_BYTES=$(wc -c < "$root" 2>/dev/null || echo 0)"
            if [ -f "$headers" ]; then
              grep -iE '^(HTTP/|content-type:|cache-control:|server:|cf-ray:|location:|content-length:)' "$headers" | tail -12 || true
            fi
            if [ -s "$root" ]; then
              python - "$root" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          print("RELEASE_MARKER_PRESENT=", "06-11-2026-A" in s)
          assets=list(dict.fromkeys(re.findall(r'''(?:src|href)=["']([^"']*/_next/static/[^"']+\.js(?:\?[^"']*)?)["']''',s)))
          print("JS_ASSETS=",len(assets))
          for x in assets[:8]: print("ASSET="+x)
          open('/tmp/probe/assets.txt','w').write('\n'.join(assets[:8]))
          PY
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                if [[ "$asset" = http* ]]; then url="$asset"; else url="https://app.eltbabak.ir$asset"; fi
                assetfile="/tmp/probe/asset-$target-$(echo "$asset" | md5sum | cut -c1-8).js"
                ah="/tmp/probe/asset-h-$target-$(echo "$asset" | md5sum | cut -c1-8).txt"
                acode=$(curl -sS -L "${resolve_args[@]}" --connect-timeout 12 --max-time 35 -D "$ah" -o "$assetfile" -w '%{http_code}' "$url" || true)
                echo "ASSET_HTTP=$acode BYTES=$(wc -c < "$assetfile" 2>/dev/null || echo 0) URL=$asset"
                grep -iE '^(HTTP/|content-type:|cache-control:|content-length:)' "$ah" | tail -4 || true
              done < /tmp/probe/assets.txt
            fi
          done

      - name: Run a real Chromium browser against the custom domain
        shell: bash
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > probe.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            const page = await browser.newPage();
            page.on('pageerror', e => console.log('PAGE_ERROR=' + e.message));
            page.on('console', m => { if (m.type() === 'error') console.log('CONSOLE_ERROR=' + m.text()); });
            page.on('requestfailed', r => console.log('REQUEST_FAILED=' + r.url() + ' :: ' + (r.failure()?.errorText || '')));
            page.on('response', r => { if (r.url().includes('/_next/')) console.log('NEXT_RESPONSE=' + r.status() + ' ' + r.url()); });
            try {
              const response = await page.goto('https://app.eltbabak.ir/', { waitUntil: 'domcontentloaded', timeout: 45000 });
              console.log('NAVIGATION_STATUS=' + (response?.status() ?? 'none'));
              await page.waitForTimeout(20000);
              console.log('FINAL_URL=' + page.url());
              console.log('BODY_TEXT=' + (await page.locator('body').innerText()).slice(0, 1400).replace(/\\s+/g, ' '));
            } catch (e) { console.log('NAVIGATION_ERROR=' + e.message); }
            await browser.close();
          })();
          JS
          node probe.cjs

      - name: Compare app entry flow on custom and Render hostnames
        shell: bash
        run: |
          cd /tmp/pw
          cat > compare.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            for (const url of ['https://app.eltbabak.ir/', 'https://ai-content-factory-6m32.onrender.com/']) {
              const page = await browser.newPage();
              page.on('pageerror', e => console.log('COMPARE_PAGE_ERROR=' + url + ' :: ' + e.message));
              page.on('requestfailed', r => console.log('COMPARE_REQUEST_FAILED=' + r.url() + ' :: ' + (r.failure()?.errorText || '')));
              try {
                const res = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.waitForTimeout(5000);
                console.log('COMPARE_URL=' + url + ' STATUS=' + (res?.status() ?? 'none'));
                console.log('COMPARE_BODY=' + (await page.locator('body').innerText()).slice(0, 650).replace(/\\s+/g, ' '));
                const start = page.getByText('شروع رایگان', { exact: true }).first();
                console.log('START_VISIBLE=' + await start.isVisible().catch(() => false));
                console.log('START_HREF=' + (await start.getAttribute('href').catch(() => null)));
                if (await start.isVisible().catch(() => false)) {
                  await start.click();
                  await page.waitForTimeout(1200);
                  console.log('AUTH_EMAIL_INPUT_VISIBLE=' + await page.locator('input[type="email"]').first().isVisible().catch(() => false));
                  console.log('AUTH_PASSWORD_INPUT_VISIBLE=' + await page.locator('input[type="password"]').first().isVisible().catch(() => false));
                }
                const apiPage = await browser.newPage();
                const apiResponse = await apiPage.goto(url + '/api/integrations/instagram/status');
                console.log('INSTAGRAM_STATUS_UNAUTH=' + (apiResponse ? apiResponse.status() : 'NO_RESPONSE'));
                await apiPage.close();
              } catch (e) { console.log('COMPARE_NAV_ERROR=' + url + ' :: ' + e.message); }
              await page.close();
            }
            await browser.close();
          })();
          JS
          node compare.cjs
