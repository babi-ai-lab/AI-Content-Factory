<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مدیریت برندها | AI Content Factory</title>
<style>
:root{--n:#1c2b5e;--b:#304a9c;--g:#d7ad55;--bg:#f5f7fb;--m:#77819a;--l:#e7ebf3;--r:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202b49;font:14px Tahoma,Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:24px;color:var(--n);margin:0 0 8px}.muted{color:var(--m);font-size:12px;line-height:2}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--n);color:#fff;font:inherit;cursor:pointer}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--l)}.btn.danger{background:#fff;color:var(--r);border:1px solid #f1c8c5}.layout{display:grid;grid-template-columns:340px 1fr;gap:16px}.panel,.brand{background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px}.panel h2{font-size:15px;color:var(--n);margin:0 0 16px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:11px;color:#59657f}.field input,.field select,.field textarea{width:100%;border:1px solid #dce2ed;border-radius:9px;padding:11px;font:inherit;font-size:12px}.field textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.brand h3{margin:0;color:var(--n);font-size:15px}.brand p{font-size:12px;color:var(--m);line-height:1.9;min-height:38px}.meta{font-size:10px;color:var(--m);margin:8px 0 14px}.actions{display:flex;gap:7px;flex-wrap:wrap}.msg{font-size:11px;color:var(--r);min-height:20px}.empty{padding:40px 15px;text-align:center;color:var(--m);background:#fff;border:1px solid var(--l);border-radius:13px;grid-column:1/-1}.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}.bar h2{font-size:15px;color:var(--n)}@media(max-width:800px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wrap{padding:18px 13px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="muted"><a href="/dashboard.html">داشبورد</a> / برندها</div><h1>مدیریت برندها</h1><div class="muted">پروفایل برند، نوع کسب‌وکار و اطلاعات پایه هر کسب‌وکار را مدیریت کن.</div></div><a class="btn alt" href="/dashboard.html">بازگشت به داشبورد</a></header>
<div class="layout"><section class="panel"><h2 id="formTitle">افزودن برند جدید</h2><form id="form"><input type="hidden" id="id"><div class="field"><label for="name">نام برند *</label><input id="name" maxlength="160" required></div><div class="field"><label for="type">نوع کسب‌وکار</label><select id="type"><option value="">انتخاب کن</option><option value="services">خدمات</option><option value="retail">فروشگاه</option><option value="restaurant">رستوران و کافه</option><option value="real_estate">املاک</option><option value="construction">ساختمان و بازسازی</option><option value="education">آموزش</option><option value="fitness">ورزش</option><option value="personal_brand">برند شخصی</option><option value="other">سایر</option></select></div><div class="field"><label for="facts">واقعیت‌های تأییدشده برند (هر مورد در یک خط)</label><textarea id="facts" placeholder="خدمات، مزیت‌ها، سوابق قابل اثبات..."></textarea></div><div class="field"><label for="forbidden">ادعاها یا عبارت‌های ممنوع (هر مورد در یک خط)</label><textarea id="forbidden"></textarea></div><div class="msg" id="msg" role="status"></div><button class="btn" id="save">ذخیره برند</button> <button class="btn alt" type="button" id="clearFormButton">پاک‌کردن فرم</button></form></section>
<section><div class="bar"><h2>برندهای ثبت‌شده</h2><span class="muted" id="count">در حال بارگذاری...</span></div><div class="grid" id="list"><div class="empty">در حال دریافت اطلاعات...</div></div></section></div></main>
<script>
let csrf='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){let h={...(opt.headers||{})};if(opt.body){h['Content-Type']='application/json';h['X-CSRF-Token']=csrf;}const r=await fetch(url,{...opt,headers:h,credentials:'same-origin',cache:'no-store'});const d=await r.json().catch(()=>({error:'پاسخ نامعتبر'}));if(r.status===401||r.status===403){location.href='/login.html';throw Error('نشست منقضی شده است.')}if(!r.ok)throw Error(d.error||'درخواست ناموفق');return d}
function lines(s){return s?String(s).split('\n').map(x=>x.trim()).filter(Boolean):[]}
function clearForm(){HTMLFormElement.prototype.reset.call($('form'));$('id').value='';$('formTitle').textContent='افزودن برند جدید';$('save').textContent='ذخیره برند';$('msg').textContent=''}
async function load(){try{const me=await api('/api/auth/me');csrf=me.csrf_token||'';const data=await api('/api/brands'),items=data.items||[];$('count').textContent=items.length+' از ۱۰ برند';$('list').innerHTML=items.length?items.map(x=>'<article class="brand"><h3>'+esc(x.name)+'</h3><div class="meta">'+esc(x.business_type||'نوع کسب‌وکار ثبت نشده')+'</div><p>'+esc((x.verified_facts_json?JSON.parse(x.verified_facts_json).join('، '):'هنوز واقعیت تأییدشده‌ای ثبت نشده است.'))+'</p><div class="actions"><button class="btn alt" data-edit="'+esc(x.id)+'">ویرایش</button><button class="btn danger" data-del="'+esc(x.id)+'">حذف</button></div></article>').join(''):'<div class="empty">هنوز برندی ثبت نکرده‌ای. از فرم کنار صفحه شروع کن.</div>';}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='در حال ذخیره...';const id=$('id').value;const payload={name:$('name').value.trim(),business_type:$('type').value||null,verified_facts:lines($('facts').value),forbidden_claims:lines($('forbidden').value)};try{await api(id?'/api/brands/'+id:'/api/brands',{method:id?'PATCH':'POST',body:JSON.stringify(payload)});clearForm();await load();}catch(err){$('msg').textContent=err.message}});
$('list').addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(edit){try{const d=await api('/api/brands');const x=(d.items||[]).find(v=>v.id===edit.dataset.edit);if(!x)return;$('id').value=x.id;$('name').value=x.name||'';$('type').value=x.business_type||'';$('facts').value=x.verified_facts_json?JSON.parse(x.verified_facts_json).join('\n'):'';$('forbidden').value=x.forbidden_claims_json?JSON.parse(x.forbidden_claims_json).join('\n'):'';$('formTitle').textContent='ویرایش برند';$('save').textContent='ذخیره تغییرات';window.scrollTo({top:0,behavior:'smooth'});}catch(err){alert(err.message)}}if(del&&confirm('این برند حذف شود؟ محتواهای مرتبط را پیش از حذف بررسی کن.')){try{await api('/api/brands/'+del.dataset.del,{method:'DELETE',body:'{}'});await load();}catch(err){alert(err.message)}}});
$('clearFormButton').addEventListener('click',clearForm);load();
</script></body></html>
