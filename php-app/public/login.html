<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ورود | AI Content Factory</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#1c2b5e;font-family:Tahoma,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);background:#fff;border:1px solid #e4e8f1;border-radius:18px;padding:28px;box-shadow:0 12px 40px #1c2b5e12}h1{font-size:22px;margin:0 0 10px}p{color:#59657f;line-height:1.9;font-size:13px}label{display:block;font-size:13px;margin:17px 0 7px}input{width:100%;padding:13px;border:1px solid #d7ddeb;border-radius:9px;font:inherit;font-size:14px}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#1c2b5e;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.55}#result{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:16px;font-size:13px;line-height:1.9}.ok{color:#147a45}.error{color:#b42318}
</style>
</head>
<body>
<main class="card">
<h1>ورود به AI Content Factory</h1>
<p>با ایمیل و رمز عبوری که هنگام ساخت حساب مدیر تعیین کردی وارد شو.</p>
<form id="login">
<label for="email">ایمیل</label><input id="email" type="email" maxlength="254" autocomplete="username" required>
<label for="password">رمز عبور</label><input id="password" type="password" maxlength="200" autocomplete="current-password" required>
<button id="submit" type="submit">ورود</button>
</form>
<div id="result" role="status" aria-live="polite"></div>
</main>
<script>
const form=document.getElementById('login'),result=document.getElementById('result'),button=document.getElementById('submit');
form.addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;result.className='';result.textContent='در حال بررسی اطلاعات ورود...';
 try{
  const csrfResponse=await fetch('/api/csrf',{credentials:'same-origin',cache:'no-store'});
  const csrfData=await csrfResponse.json();
  if(!csrfResponse.ok||!csrfData.csrf_token)throw new Error('دریافت توکن امنیتی ناموفق بود.');
  const response=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfData.csrf_token},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});
  const data=await response.json();
  if(!response.ok)throw new Error(response.status===401?'ایمیل یا رمز عبور صحیح نیست.':(data.error||'ورود ناموفق بود.'));
  form.hidden=true;result.className='ok';result.textContent='ورود موفق بود. نشست امن ایجاد شد.\nایمیل حساب: '+(data.user.email||'')+'\n\nاکنون احراز هویت API را بررسی می‌کنیم...';
  const meResponse=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});
  const meData=await meResponse.json();
  if(!meResponse.ok||!meData.user)throw new Error('ورود انجام شد اما تأیید نشست ناموفق بود.');
  result.textContent='ورود و تأیید نشست موفق بود. در حال انتقال به داشبورد...';\n  window.location.replace('/dashboard.html');
 }catch(error){result.className='error';result.textContent=error.message||'خطای نامشخص';button.disabled=false;}
});
</script>
</body>
</html>
