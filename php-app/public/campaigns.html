<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مدیریت کمپین‌ها | AI Content Factory</title>
<style>
:root{--n:#1c2b5e;--b:#304a9c;--g:#d7ad55;--bg:#f5f7fb;--m:#77819a;--l:#e7ebf3;--r:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#202b49;font:14px Tahoma,Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:24px;color:var(--n);margin:0 0 8px}.muted{color:var(--m);font-size:12px;line-height:2}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--n);color:#fff;font:inherit;cursor:pointer}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--l)}.btn.danger{background:#fff;color:var(--r);border:1px solid #f1c8c5}.layout{display:grid;grid-template-columns:340px 1fr;gap:16px}.panel,.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px}.panel h2{font-size:15px;color:var(--n);margin:0 0 16px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:11px;color:#59657f}.field input,.field select,.field textarea{width:100%;border:1px solid #dce2ed;border-radius:9px;padding:11px;font:inherit;font-size:12px}.field textarea{min-height:90px;resize:vertical}.cards{display:grid;gap:12px}.card h3{margin:0;color:var(--n);font-size:15px}.card p{font-size:12px;color:#58637c;line-height:1.9;white-space:pre-wrap}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{font-size:10px;background:#eef2fa;color:#40558e;padding:5px 9px;border-radius:20px}.actions{display:flex;gap:7px;flex-wrap:wrap}.msg{font-size:11px;color:var(--r);min-height:20px}.empty{padding:40px 15px;text-align:center;color:var(--m);background:#fff;border:1px solid var(--l);border-radius:13px}.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}.bar h2{font-size:15px;color:var(--n)}@media(max-width:800px){.layout{grid-template-columns:1fr}.wrap{padding:18px 13px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="muted"><a href="/dashboard.html">داشبورد</a> / کمپین‌ها</div><h1>مدیریت کمپین‌ها</h1><div class="muted">هدف، مخاطب، کانال و بازه زمانی کمپین‌های بازاریابی را ثبت و پیگیری کن.</div></div><a class="btn alt" href="/dashboard.html">بازگشت به داشبورد</a></header>
<div class="layout"><section class="panel"><h2>ایجاد کمپین جدید</h2><form id="form"><div class="field"><label for="name">نام کمپین *</label><input id="name" maxlength="200" required></div><div class="field"><label for="objective">هدف کمپین</label><textarea id="objective" maxlength="500"></textarea></div><div class="field"><label for="audience">مخاطب هدف</label><textarea id="audience" maxlength="10000"></textarea></div><div class="field"><label for="channels">کانال‌ها (با ویرگول جدا کن)</label><input id="channels" placeholder="اینستاگرام، پیامک، وب‌سایت"></div><div class="field"><label for="start">تاریخ شروع</label><input id="start" type="date"></div><div class="field"><label for="end">تاریخ پایان</label><input id="end" type="date"></div><div class="msg" id="msg" role="status"></div><button class="btn" type="submit">ثبت کمپین</button></form></section>
<section><div class="bar"><h2>کمپین‌های من</h2><span class="muted" id="count">در حال بارگذاری...</span></div><div class="cards" id="list"><div class="empty">در حال دریافت اطلاعات...</div></div></section></div></main>
<script>
let csrf='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){let h={...(opt.headers||{})};if(opt.body){h['Content-Type']='application/json';h['X-CSRF-Token']=csrf;}const r=await fetch(url,{...opt,headers:h,credentials:'same-origin',cache:'no-store'});const d=await r.json().catch(()=>({error:'پاسخ نامعتبر'}));if(r.status===401||r.status===403){location.href='/login.html';throw Error('نشست منقضی شده است.')}if(!r.ok)throw Error(d.error||'درخواست ناموفق');return d}
async function load(){try{const me=await api('/api/auth/me');csrf=me.csrf_token||'';const d=await api('/api/campaigns'),items=d.items||[];$('count').textContent=items.length+' کمپین';$('list').innerHTML=items.length?items.map(x=>{let channels=[];try{channels=JSON.parse(x.channels_json||'[]')}catch{}return '<article class="card"><h3>'+esc(x.name)+'</h3><div class="meta"><span class="pill">'+esc(x.status||'در برنامه')+'</span>'+(x.starts_on?'<span class="pill">شروع: '+esc(x.starts_on)+'</span>':'')+(x.ends_on?'<span class="pill">پایان: '+esc(x.ends_on)+'</span>':'')+channels.map(c=>'<span class="pill">'+esc(c)+'</span>').join('')+'</div><p><b>هدف:</b> '+esc(x.objective||'ثبت نشده')+'<br><b>مخاطب:</b> '+esc(x.audience||'ثبت نشده')+'</p><div class="actions"><button class="btn danger" data-del="'+esc(x.id)+'">حذف کمپین</button></div></article>'}).join(''):'<div class="empty">هنوز کمپینی ثبت نشده است. از فرم کنار صفحه شروع کن.</div>';}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('msg').textContent='در حال ذخیره...';const start=$('start').value,end=$('end').value;if(start&&end&&end<start){$('msg').textContent='تاریخ پایان نمی‌تواند قبل از شروع باشد.';return}try{await api('/api/campaigns',{method:'POST',body:JSON.stringify({name:$('name').value.trim(),objective:$('objective').value.trim(),audience:$('audience').value.trim(),channels:$('channels').value.split(',').map(x=>x.trim()).filter(Boolean),starts_on:start||null,ends_on:end||null})});$('form').reset();$('msg').textContent='کمپین ثبت شد.';await load()}catch(err){$('msg').textContent=err.message}});
$('list').addEventListener('click',async e=>{const b=e.target.closest('[data-del]');if(b&&confirm('این کمپین حذف شود؟'))try{await api('/api/campaigns/'+b.dataset.del,{method:'DELETE',body:'{}'});await load()}catch(err){alert(err.message)}});load();
</script></body></html>
